<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="MediaRise">
  <!-- lado esquerdo do M (cinza claro) -->
  <path d="M16 100 L36 24 L60 70"
        stroke="#ECECE4" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lado direito do M = seta de crescimento (verde) -->
  <path d="M60 70 L88 22 L104 100"
        stroke="#AEE635" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ponta da seta para cima -->
  <path d="M70 40 L88 18 L106 40"
        stroke="#AEE635" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
